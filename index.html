    if(!b){ s.cw = [[a, 1]]; }
    else { const da = angd(s.phi, a.phi), db = angd(s.phi, b.phi);
      if(Math.sign(da) === Math.sign(db) && da !== 0) s.cw = [[a, 1]];                // outside the extreme chain
      else { const wa = Math.abs(db)/(Math.abs(da) + Math.abs(db)); s.cw = [[a, wa], [b, 1 - wa]]; } }
    for(const [c, w] of s.cw) for(let j=0;j<=c.J;j++){ c.pos[j].addScaledVector(at(s.p, s.t0 + (1 - s.t0)*j/c.J), w); c.wsum[j] += w; }
  }
  /* long hair resting on the back hangs from the neck (a head turn only twists the roots under the cap); face locks follow the head */
  const neck = by(opts.anchorBone || "J_Bip_C_UpperChest");
  const bones = [head], boneIdx = new Map();
  for(const c of chains){ c.bones = []; c.anchor = (!opts.headAnchored && (c.g === "back" || c.g === "side")) ? neck : head;
    for(let j=0;j<=c.J;j++){ c.pos[j].multiplyScalar(1/Math.max(1e-6, c.wsum[j]));
      const b = new T.Bone(); b.name = `J_Hair_${c.g}${c.idx}_${j}`; (j === 0 ? c.anchor : c.bones[j - 1]).add(b);
      b.parent.updateMatrixWorld(true); b.position.copy(b.parent.worldToLocal(c.pos[j].clone())); b.updateMatrixWorld(true);
      c.bones.push(b); boneIdx.set(b, bones.length); bones.push(b); } }

  /* ---- ribbons ---- */
  const pos = [], nor = [], uvs = [], tan = [], rr = [], arc = [], si = [], sw = [], idx = [];
  const T0 = V3(), out = V3(), side = V3(), nrm = V3(), q = V3();
  for(const s of strands){
    const P = s.p, N = P.length, base = pos.length/3; let acc = 0;
    for(let i=0;i<N;i++){ if(i) acc += P[i].distanceTo(P[i - 1]);
      const t = i/(N - 1);
      T0.subVectors(P[Math.min(N - 1, i + 1)], P[Math.max(0, i - 1)]).normalize();
      out.set(P[i].x, 0, P[i].z - axisZ(P[i].y)); if(out.lengthSq() < 1e-8) out.set(0, 0, 1); out.normalize();
      side.crossVectors(T0, out); if(side.lengthSq() < 1e-8) side.set(1, 0, 0); side.normalize(); nrm.crossVectors(side, T0).normalize();
      const taper = (0.7 + 0.3*sst(0, 0.1, t))*(1 - 0.7*sst(s.tip, 1, t))*(1 + 0.18*sst(0.15, 0.5, t)*(1 - sst(0.5, 0.9, t)));
      const w = s.w*taper, bul = w*0.08;
      out.addScaledVector(T0, -out.dot(T0)).normalize();
      for(let k=0;k<3;k++){ const sx = k - 1;
        q.copy(P[i]).addScaledVector(side, sx*w*0.5).addScaledVector(nrm, k === 1 ? bul : 0); pos.push(q.x, q.y, q.z);
        q.copy(out).addScaledVector(nrm, 0.15).addScaledVector(side, sx*0.06).normalize(); nor.push(q.x, q.y, q.z);
        uvs.push((s.pat + 0.004 + k*0.496)/4, Math.pow(t, s.vp)); tan.push(T0.x, T0.y, T0.z); rr.push(s.phi*R2D); arc.push((s.g === "back" || s.g === "side" || s.g === "tail") ? -tmp.subVectors(P[i], C0).dot(yA) : 0.5);
        /* weights: head at the very root, then two chains x two bones along */
        const wh = s.t0 > 0 ? 1 - sst(s.t0, s.t0 + 0.06, t) : 1 - sst(0.0, (s.g === "back" || s.g === "side") ? 0.11 : 0.07, t), ws = [];
        for(const [c, cw] of s.cw){ const x = Math.max(0, (t - s.t0)/(1 - s.t0))*c.J;
          for(let b=0;b<c.J;b++){ const hw = Math.max(0, 1 - Math.abs(x - (b + 0.5))); if(hw > 0) ws.push([boneIdx.get(c.bones[b]), hw*cw*(1 - wh)]); }
          if(x < 0.5) ws.push([boneIdx.get(c.bones[0]), 0]); }
        ws.push([0, wh]);
        const agg = new Map(); for(const [b, ww] of ws) agg.set(b, (agg.get(b) || 0) + ww);
        let arr = [...agg.entries()].filter(e => e[1] > 1e-4).sort((a, b) => b[1] - a[1]).slice(0, 4); const tot = arr.reduce((a, e) => a + e[1], 0) || 1;
        while(arr.length < 4) arr.push([0, 0]);
        for(const [b, ww] of arr){ si.push(b); sw.push(ww/tot); } }
    }
    for(let i=0;i<N - 1;i++){ const a = base + i*3, b = a + 3; idx.push(a, b, a + 1, a + 1, b, b + 1, a + 1, b + 1, a + 2, a + 2, b + 1, b + 2); }
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new T.Float32BufferAttribute(nor, 3)); g.setAttribute("uv", new T.Float32BufferAttribute(uvs, 2));
  g.setAttribute("aT", new T.Float32BufferAttribute(tan, 3)); g.setAttribute("aR", new T.Float32BufferAttribute(rr, 1)); g.setAttribute("aS", new T.Float32BufferAttribute(arc, 1));
  g.setAttribute("skinIndex", new T.Uint16BufferAttribute(si, 4)); g.setAttribute("skinWeight", new T.Float32BufferAttribute(sw, 4)); g.setIndex(idx);
  g.computeBoundingSphere();

  /* ---- strand texture: 4 lock patterns side by side (each strand picks one); soft root-to-tip gradient, fine strand lines,
     opaque body and pointed tips that split into 1-3 sub-points (alpha) ---- */
  const TW = 256, TH = 512, PW = TW/4;
  const cv = document.createElement("canvas"); cv.width = TW; cv.height = TH; const cx = cv.getContext("2d");
  const grd = cx.createLinearGradient(0, 0, 0, TH); const H = opts.hairColors || ["#18181e", "#20202a", "#2a2a38"];
  grd.addColorStop(0, H[0]); grd.addColorStop(0.45, H[1]); grd.addColorStop(1, H[2]); cx.fillStyle = grd; cx.fillRect(0, 0, TW, TH);
  for(let i=0;i<80;i++){ const x = rnd()*TW, wv = 0.6 + rnd()*1.4, l = rnd() < 0.5; cx.fillStyle = l ? "rgba(150,155,190,0.035)" : "rgba(0,0,6,0.09)"; cx.fillRect(x, 0, wv, TH); }
  for(let p=0;p<4;p++){ const eg = cx.createLinearGradient(p*PW, 0, (p + 1)*PW, 0); eg.addColorStop(0, "rgba(0,0,8,0.14)"); eg.addColorStop(0.12, "rgba(0,0,8,0)"); eg.addColorStop(0.88, "rgba(0,0,8,0)"); eg.addColorStop(1, "rgba(0,0,8,0.14)");
    cx.fillStyle = eg; cx.fillRect(p*PW, 0, PW, TH); }
  { const im = cx.getImageData(0, 0, TW, TH), A = im.data;
    const SUB = [[[0.5, 0.5, 0.995]], [[0.3, 0.32, 0.93], [0.72, 0.3, 0.995]], [[0.28, 0.3, 0.995], [0.7, 0.32, 0.9]], [[0.18, 0.2, 0.9], [0.5, 0.2, 0.995], [0.82, 0.2, 0.94]]];
    for(let p=0;p<4;p++) for(let xi=0;xi<PW;xi++){ const ux = (xi + 0.5)/PW;
      let cut = 0; for(const [c, hw, e] of SUB[p]){ const d = Math.abs(ux - c)/hw; if(d < 1) cut = Math.max(cut, e - 0.16*Math.pow(d, 1.25)); }
      cut = Math.max(cut, 0.72);                                                                  /* gaps between sub-points never reach the body */
      for(let y=0;y<TH;y++){ const vv = (y + 0.5)/TH, a = 1 - sst(cut - 0.012, cut, vv); A[(y*TW + p*PW + xi)*4 + 3] = Math.round(255*a); } }

  const tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding; tex.anisotropy = opts.anisotropy || 4;

  mesh.bind(new T.Skeleton(bones), mesh.matrixWorld);

  /* ---- spring chains ---- */
  const SP = {back: {st: [0.9, 0.5, 0.36, 0.28, 0.24, 0.2], gp: 0.26, dr: 0.42, hr: 0.024},
              side: {st: [0.9, 0.5, 0.38, 0.3, 0.26], gp: 0.2, dr: 0.42, hr: 0.016},
              frame: {st: [0.95, 0.6, 0.5, 0.42, 0.38], gp: 0.18, dr: 0.45, hr: 0.012},
              bang: {st: [1.3, 0.9], gp: 0.04, dr: 0.5, hr: 0.006},
              tail: {st: [1.1, 0.7, 0.5, 0.42, 0.36], gp: 0.3, dr: 0.38, hr: 0.02}};
  if(opts.springs) for(const k in opts.springs) SP[k] = Object.assign({}, SP[k] || SP.back, opts.springs[k]);
  const groupsAll = (META.colliderGroups || []).map((_, i) => i).filter(i => i <= 9);
  const springs = chains.map(c => { const p = SP[c.g];
    return {name: "Hair", groups: c.g === "bang" ? [] : groupsAll, center: null, joints: c.bones.map((b, j) => ({node: b.name, hitRadius: j === c.J ? 0 : p.hr, stiffness: p.st[Math.min(j, p.st.length - 1)], gravityPower: j === c.J ? 0 : p.gp, gravityDir: [0, -1, 0], dragForce: p.dr}))}; });
  for(const [o, p, q2, s2] of snap){ o.position.copy(p); o.quaternion.copy(q2); o.scale.copy(s2); } model.updateMatrixWorld(true);
  return {mesh, springs, bones, strands: strands.length, verts: pos.length/3, tie: tieInfo};
}

/* clear vinyl umbrella (built in centimetres; origin = the grip, shaft along +Y) */
function makeUmbrella(env){
  const R = 50, CT = 1.04, CS = 0.46, L = 78;
  const umb = new T.Group(), spin = new T.Group(); umb.add(spin);
  const white = new T.MeshStandardMaterial({color:0xf2f3f5, roughness:0.35, envMap:env, envMapIntensity:0.9});
  const steel = new T.MeshStandardMaterial({color:0xcfd5dc, roughness:0.28, metalness:0.85, envMap:env, envMapIntensity:1.0});
  const add = (geo, mat, x, y, z, p) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; (p || umb).add(m); return m; };
  add(new T.CylinderGeometry(0.55, 0.55, L + 10, 10), steel, 0, (L - 10)/2, 0);
  add(new T.CylinderGeometry(1.15, 1.05, 13, 16), white, 0, -2.5, 0);
  { const hook = add(new T.TorusGeometry(3.9, 1.0, 10, 22, Math.PI), white, -3.9, -9, 0); hook.rotation.z = Math.PI; }
  add(new T.SphereGeometry(1.0, 12, 8), white, -7.8, -9, 0);
  const c0 = L - R*CS;
  const cg = new T.SphereGeometry(R, 64, 14, 0, Math.PI*2, 0, CT);
  { const P = cg.attributes.position, v = new T.Vector3();
    for(let i=0;i<P.count;i++){ v.fromBufferAttribute(P, i); const t = Math.acos(Math.max(-1, Math.min(1, v.y/R)))/CT, ph = Math.atan2(v.z, v.x), sc = 0.5 - 0.5*Math.cos(8*ph);
      const f = 1 - 0.045*Math.pow(t, 1.6)*sc; P.setXYZ(i, v.x*f, v.y + 1.6*t*t*sc, v.z*f); } }
  cg.computeVertexNormals();
  const dropTex = ctex(1024, 256, (g, w, h) => {
    const rnd = mulberry(7);
    g.fillStyle = "rgba(226,238,255,0.2)"; g.fillRect(0, 0, w, h);
    for(let i=0;i<900;i++){ const x = rnd()*w, y = 6 + rnd()*(h - 18), r = 0.8 + rnd()*rnd()*4.2;
      g.fillStyle = "rgba(150,175,215,0.2)"; g.beginPath(); g.ellipse(x + r*0.3, y + r*0.4, r, r*1.12, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = "rgba(255,255,255,0.4)"; g.beginPath(); g.ellipse(x, y, r, r*1.12, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = "rgba(255,255,255,0.95)"; g.beginPath(); g.arc(x - r*0.35, y - r*0.42, Math.max(0.5, r*0.3), 0, Math.PI*2); g.fill(); }
    g.fillStyle = "rgba(236,242,250,0.85)"; g.fillRect(0, h - 7, w, 7);
  });
  const canopy = new T.Mesh(cg, new T.MeshStandardMaterial({color:0xffffff, map:dropTex, transparent:true, side:T.DoubleSide, depthWrite:false, roughness:0.1, metalness:0, envMap:env, envMapIntensity:1.3}));
  canopy.scale.y = CS; canopy.position.y = c0; canopy.renderOrder = 5; spin.add(canopy);
  const ribPts = [], tips = [];
  for(let k=0;k<8;k++){ const a = k*Math.PI/4;
    for(let j=0;j<10;j++){ const t0 = j/10*CT, t1 = (j+1)/10*CT;
      ribPts.push(v3(Math.sin(t0)*Math.cos(a)*R*0.985, c0 + Math.cos(t0)*R*CS*0.985, Math.sin(t0)*Math.sin(a)*R*0.985), v3(Math.sin(t1)*Math.cos(a)*R*0.985, c0 + Math.cos(t1)*R*CS*0.985, Math.sin(t1)*Math.sin(a)*R*0.985)); }
    const mid = 0.55*CT; ribPts.push(v3(Math.sin(mid)*Math.cos(a)*R*0.97, c0 + Math.cos(mid)*R*CS*0.97, Math.sin(mid)*Math.sin(a)*R*0.97), v3(0, L - 30, 0));
    const tip = v3(Math.sin(CT)*Math.cos(a)*R, c0 + Math.cos(CT)*R*CS, Math.sin(CT)*Math.sin(a)*R); tips.push(tip);
    add(new T.SphereGeometry(0.75, 8, 6), white, tip.x, tip.y - 0.4, tip.z, spin); }
  spin.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(ribPts), new T.LineBasicMaterial({color:0xf4f6fa, transparent:true, opacity:0.8})));
  add(new T.CylinderGeometry(0.6, 1.6, 3.4, 12), white, 0, L + 1.2, 0, spin);
  add(new T.CylinderGeometry(1.3, 1.3, 3, 12), white, 0, L - 30, 0, spin);

}

/* small jewellery: a long fine chain with a raindrop pendant over the tee, a thin bangle on the right wrist */
function makeJewellery(model, env){
  const by = n => model.getObjectByName(n), V = (x, y, z) => new T.Vector3(x, y, z);
  model.updateMatrixWorld(true);
  const tops = []; model.traverse(o => { if(o.isMesh && o.material && /Tops_01/.test(o.material.name)){ const P = o.geometry.attributes.position; for(let i=0;i<P.count;i++) tops.push(P.getX(i), P.getY(i), P.getZ(i)); } });
  const front = (x, y) => { let z = -1; for(let i=0;i<tops.length;i+=3){ if(Math.abs(tops[i] - x) < 0.014 && Math.abs(tops[i+1] - y) < 0.014) z = Math.max(z, tops[i+2]); } return z; };
  const neck = by("J_Bip_C_Neck"), chest = by("J_Bip_C_UpperChest"), np = neck.getWorldPosition(V(0, 0, 0));
  const silver = new T.MeshStandardMaterial({color: 0xeef1f6, metalness: 1, roughness: 0.22, envMap: env, envMapIntensity: 1.4});
  const yb = np.y - 0.012, pendY = np.y - 0.15;
  const pts = [V(0, yb + 0.012, np.z - 0.05), V(0.04, yb + 0.006, np.z - 0.035), V(0.062, yb - 0.004, np.z), V(0.056, yb - 0.02, 0), V(0.034, np.y - 0.08, 0), V(0.012, pendY + 0.012, 0), V(0, pendY + 0.006, 0)];
  for(const p of pts) if(p.z === 0) p.z = front(p.x, p.y) + 0.004;
  const all = pts.concat(pts.slice(1, -1).reverse().map(p => V(-p.x, p.y, p.z)));
  const curve = new T.CatmullRomCurve3(all, true, "centripetal");
  const chain = new T.Mesh(new T.TubeGeometry(curve, 120, 0.0011, 5, true), silver);
  const drop = new T.Group(), pz = front(0, pendY - 0.01) + 0.006;
  const gem = new T.Mesh(new T.SphereGeometry(0.0062, 18, 12), new T.MeshStandardMaterial({color: 0xcfe8ff, metalness: 0.1, roughness: 0.04, envMap: env, envMapIntensity: 1.8, emissive: 0x16304a}));
  const tip = new T.Mesh(new T.ConeGeometry(0.0054, 0.011, 18), gem.material); tip.position.y = 0.0068;
  const cap = new T.Mesh(new T.TorusGeometry(0.0022, 0.0007, 6, 14), silver); cap.position.y = 0.0135;
  drop.add(gem, tip, cap); drop.position.set(0, pendY - 0.006, pz);
  const neckGroup = new T.Group(); neckGroup.add(chain, drop);
  neckGroup.applyMatrix4(chest.matrixWorld.clone().invert()); chest.add(neckGroup);
  const la = by("J_Bip_R_LowerArm"), hd = by("J_Bip_R_Hand"), hp = hd.getWorldPosition(V(0, 0, 0)), ep = la.getWorldPosition(V(0, 0, 0));
  const ax = hp.clone().sub(ep).normalize(), bangle = new T.Mesh(new T.TorusGeometry(0.03, 0.0021, 8, 40), silver);
  bangle.position.copy(hp).addScaledVector(ax, -0.022); bangle.quaternion.setFromUnitVectors(V(0, 0, 1), ax);
  bangle.applyMatrix4(la.matrixWorld.clone().invert()); la.add(bangle);
  for(const m of [chain, gem, tip, cap, bangle]){ m.castShadow = false; m.layers.set(NOREF); }
}

function buildNPC(T, src, META0, kind, ctx){
  const L = NPC_LOOKS[kind];
  const model = T.SkeletonUtils.clone(src.scene), by = n => model.getObjectByName(n);
  by("J_Bip_C_Head").scale.setScalar(L.headS);
  model.updateMatrixWorld(true);
  const clip = n => src.animations.find(c => c.name === n);
  /* hair, draped in her standing idle pose */
  const pm = new T.AnimationMixer(model);
  const hair = makeHair(T, model, META0, Object.assign({seed: L.seed, hairColors: L.hairColors, anisotropy: ctx.anisotropy || 4,
    pose: () => { pm.clipAction(clip("n_idle")).play(); pm.setTime(0.5); }}, L.hair));
  pm.stopAllAction(); pm.uncacheRoot(model);
  const META = Object.assign({}, META0, {springs: META0.springs.filter(s => s.name !== "Hair").concat(hair.springs)});
  const OC = [0.06, 0.009, 0.014];
  const mt = {Face_00_SKIN: {shift: 0.32}, FaceMouth_00_FACE: {shift: 0.32}, Body_00_SKIN: {tint: [1.0, 0.985, 0.98], shade: [0.97, 0.84, 0.86]},
    ProcHair: {shade: [0.6, 0.56, 0.62], shift: -0.1, toony: 0.8, outline: 0}, HairBack_00_HAIR: {shade: [0.6, 0.56, 0.62], shift: -0.1, toony: 0.8, outline: 0}};
  for(const k in L.mtoon) mt[k] = Object.assign({outlineColor: OC}, L.mtoon[k]);
  const ch = makeAnimeChar(T, {scene: model, animations: src.animations}, META, {keyUniforms: ctx.KEYU, outlineScale: 2.6, gi: 0.72, giSat: 0.45, rimFresnel: new T.Color(0.08, 0.1, 0.16),
    outlineTint: new T.Color(0x1d1a30), anisotropy: ctx.anisotropy || 4, hairA2C: ctx.hairA2C, hairHi: new T.Color().fromArray(L.hairHi), outlineMask: ctx.outlineMask, mtoon: mt});
  /* outfit textures */
  for(const name in L.tex){ const m = ch.mats[name]; if(!m) continue;
    const tx = ctx.texLoader.load(L.tex[name]); tx.flipY = false; tx.encoding = T.sRGBEncoding; tx.anisotropy = ctx.anisotropy || 4; m.map = tx; m.needsUpdate = true; }
  if(ch.mats.FaceBrow_00_FACE) ch.mats.FaceBrow_00_FACE.color.multiply(new T.Color().fromArray(L.brow));
  { const hid = new Set(); for(const o of ch.parts) if(/Bottoms_01/.test(o.material.name || "")){ o.visible = false; hid.add(o.geometry); }
    for(const o of ch.outlines) if(hid.has(o.geometry)) o.visible = false; }
  /* glasses (clerk): thin rounded frames, faint lenses, temples back to the ears */
  if(L.glasses){
    const head = by("J_Bip_C_Head"); model.updateMatrixWorld(true);
    /* eye centres from the eye-white mesh, lens plane just in front of the lash line (skinned rest positions, head space) */
    const acc = {L: {x: 0, y: 0, n: 0, z: -9}, R: {x: 0, y: 0, n: 0, z: -9}}, v = new T.Vector3();
    const names = [];
    model.traverse(o => { if(!o.isMesh || !o.material) return; const nm = o.material.name || ""; names.push(nm + (o.isSkinnedMesh ? "*" : ""));
      if(!/^EyeWhite_00|^FaceEyeline_00/.test(nm)) return;
      const P = o.geometry.attributes.position;
      for(let i=0;i<P.count;i++){ v.fromBufferAttribute(P, i); if(o.isSkinnedMesh) o.boneTransform(i, v); v.applyMatrix4(o.matrixWorld);
        const a = acc[v.x > 0 ? "L" : "R"]; if(/^EyeWhite/.test(nm)){ a.x += v.x; a.y += v.y; a.n++; } else a.z = Math.max(a.z, v.z); } });
    if(!acc.L.n || !acc.R.n || acc.L.z < -1) throw new Error("glasses: eye meshes not found " + JSON.stringify(acc));
    const eL = new T.Vector3(acc.L.x/acc.L.n, acc.L.y/acc.L.n, acc.L.z - 0.0085), eR = new T.Vector3(acc.R.x/acc.R.n, acc.R.y/acc.R.n, acc.R.z - 0.0085);
    /* built in rest model space (x right, y up, z forward), then parented to the head (its local frame is rotated) */
    const frameM = new T.MeshToonMaterial({color: 0x4b2c2c}), lensM = new T.MeshBasicMaterial({color: 0xcfe2ff, transparent: true, opacity: 0.12, depthWrite: false});
    const g = new T.Group();
    const lens = (c, sgn) => { const w = 0.0168, h = 0.0118, pts = [];
      for(let k=0;k<48;k++){ const a = k/48*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a), px = w*Math.sign(ca)*Math.pow(Math.abs(ca), 0.55), py = h*Math.sign(sa)*Math.pow(Math.abs(sa), 0.55);
        pts.push(new T.Vector3(c.x + px + sgn*0.002, c.y - 0.0035 + py*(px*sgn > 0 ? 1.0 : 0.94) - (px*sgn > 0 ? 0.0012 : 0), c.z + 0.0215 - Math.abs(px)*0.18)); }
      const tube = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts, true), 64, 0.0011, 5, true), frameM); g.add(tube);
      const sh = new T.Shape(); pts.forEach((p, i) => i ? sh.lineTo(p.x, p.y) : sh.moveTo(p.x, p.y));
      const lg = new T.ShapeGeometry(sh, 6); lg.translate(0, 0, c.z + 0.0205); const lm = new T.Mesh(lg, lensM); lm.renderOrder = 4; g.add(lm);
      return pts; };
    const pl = lens(eL, 1), pr = lens(eR, -1);
    const inner = (pts, sgn) => pts.reduce((b, p) => (p.x*sgn < b.x*sgn ? p : b)), outer = (pts, sgn) => pts.reduce((b, p) => (p.x*sgn > b.x*sgn ? p : b));
    const iL = inner(pl, 1), iR = inner(pr, -1);
    const br = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([iL.clone().add(new T.Vector3(0, 0.003, 0)), new T.Vector3(0, iL.y + 0.0055, iL.z + 0.002), iR.clone().add(new T.Vector3(0, 0.003, 0))]), 12, 0.001, 5, false), frameM); g.add(br);
    for(const [pts, sgn] of [[pl, 1], [pr, -1]]){ const o = outer(pts, sgn);
      const tm = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([o, o.clone().add(new T.Vector3(sgn*0.006, 0.001, -0.02)), o.clone().add(new T.Vector3(sgn*0.011, -0.002, -0.07)), o.clone().add(new T.Vector3(sgn*0.008, -0.012, -0.09))]), 16, 0.0011, 5, false), frameM);
      g.add(tm); }
    g.traverse(o => { if(o.isMesh){ o.castShadow = false; o.layers.set(ctx.NOREF); } });
    g.applyMatrix4(head.matrixWorld.clone().invert()); head.add(g);
  }
  /* hair tie for the ponytail */
  if(hair.tie){ const tie = new T.Mesh(new T.TorusGeometry(0.014, 0.0055, 8, 18), new T.MeshToonMaterial({color: 0xd9a33a}));
    tie.position.copy(hair.tie.head); tie.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), hair.tie.dir); by("J_Bip_C_Head").add(tie); tie.castShadow = false; }
  /* props held in the hands (shown only during their actions) */
  const props = {};
  const canTex = (() => { const c = document.createElement("canvas"); c.width = 128; c.height = 64; const g2 = c.getContext("2d");
    g2.fillStyle = "#3a2318"; g2.fillRect(0, 0, 128, 64); g2.fillStyle = "#e9dcc4"; g2.fillRect(0, 18, 128, 26); g2.fillStyle = "#b8372e"; g2.fillRect(0, 26, 128, 6);
    g2.fillStyle = "#3a2318"; g2.font = "bold 12px sans-serif"; g2.fillText("COFFEE", 40, 41); const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t; })();
  const mk = (geo, mat) => { const m = new T.Mesh(geo, mat); m.castShadow = false; m.layers.set(ctx.NOREF); return m; };
  { const g = new T.Group(); const body = mk(new T.CylinderGeometry(0.033, 0.033, 0.115, 16), [new T.MeshToonMaterial({map: canTex}), new T.MeshToonMaterial({color: 0xc9ced6}), new T.MeshToonMaterial({color: 0xc9ced6})]);
    g.add(body); props.can = g; }
  { const g = new T.Group(); g.add(mk(new T.BoxGeometry(0.072, 0.146, 0.009), new T.MeshToonMaterial({color: 0x1c1f2a})));
    const scr = mk(new T.PlaneGeometry(0.064, 0.13), new T.MeshBasicMaterial({color: new T.Color(0.55, 0.75, 1.0).multiplyScalar(ctx.HDR ? 1.6 : 1)})); scr.position.z = 0.0048; g.add(scr); props.phone = g; }
  { const g = new T.Group(); g.add(mk(new T.BoxGeometry(0.23, 0.31, 0.006), new T.MeshToonMaterial({color: 0x9a6b3f})));
    const pc = document.createElement("canvas"); pc.width = 64; pc.height = 96; const g2 = pc.getContext("2d"); g2.fillStyle = "#f4f2ea"; g2.fillRect(0, 0, 64, 96);
    g2.strokeStyle = "#8a93a6"; g2.lineWidth = 1; for(let yy=18; yy<92; yy+=7){ g2.beginPath(); g2.moveTo(6, yy); g2.lineTo(58, yy); g2.stroke(); } g2.fillStyle = "#d24b4b"; g2.fillRect(6, 8, 22, 5);
    const pt = new T.CanvasTexture(pc); pt.encoding = T.sRGBEncoding;
    const paper = mk(new T.PlaneGeometry(0.2, 0.27), new T.MeshToonMaterial({map: pt})); paper.position.set(0, -0.012, 0.0035); g.add(paper);
    const clipM = mk(new T.BoxGeometry(0.08, 0.025, 0.012), new T.MeshToonMaterial({color: 0xc9ced6})); clipM.position.set(0, 0.145, 0.006); g.add(clipM); props.clip = g; }
  for(const k in props){ props[k].visible = false; }
  { const mx = new T.AnimationMixer(model), V = () => new T.Vector3();
    const at = (name, t) => { mx.stopAllAction(); const a = mx.clipAction(clip(name)); a.reset().play(); mx.setTime(t); model.updateMatrixWorld(true); };
    const wpos = n => by(n).getWorldPosition(V());
    const hand = s => ({H: by(`J_Bip_${s}_Hand`), p: wpos(`J_Bip_${s}_Hand`), I: wpos(`J_Bip_${s}_Index1`), Li: wpos(`J_Bip_${s}_Little1`), M3: wpos(`J_Bip_${s}_Middle3`), M1: wpos(`J_Bip_${s}_Middle1`)});
    const attach = (obj, H, wPos, wQuat) => { const inv = H.matrixWorld.clone().invert(); obj.position.copy(wPos).applyMatrix4(inv);
      obj.quaternion.copy(H.getWorldQuaternion(new T.Quaternion()).invert().multiply(wQuat)); obj.scale.setScalar(1/H.getWorldScale(V()).x*model.getWorldScale(V()).x); H.add(obj); };
    const headP = () => wpos("J_Bip_C_Head");
    /* can: in the hand nearer the mouth, axis through the curled fist */
    at("n_drink", 4.0); { const R = hand("R"), Lh = hand("L"), h = R.p.distanceTo(headP()) < Lh.p.distanceTo(headP()) ? R : Lh;
      const c = h.I.clone().add(h.Li).multiplyScalar(0.5).lerp(h.M3, 0.5), ax = h.I.clone().sub(h.Li).normalize();
      const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), ax); attach(props.can, h.H, c, q); props.can.userData.side = h === R ? "R" : "L"; }
    /* phone: flat on the palm of the lower, more forward hand, screen toward the face */
    at("n_phone", 5.0); { const R = hand("R"), Lh = hand("L"), hp = headP(), h = R.p.distanceTo(hp) < Lh.p.distanceTo(hp) ? R : Lh;
      const fwd = h.M1.clone().sub(h.p).normalize(), across = h.I.clone().sub(h.Li).normalize(), n = V().crossVectors(fwd, across).normalize();
      if(n.dot(hp.clone().sub(h.p)) < 0) n.negate();
      const c = h.p.clone().lerp(h.M1, 0.75).addScaledVector(n, 0.016);
      const m = new T.Matrix4().makeBasis(V().crossVectors(fwd, n).normalize(), fwd, n); const q = new T.Quaternion().setFromRotationMatrix(m);
      attach(props.phone, h.H, c, q); props.phone.userData.side = h === R ? "R" : "L"; }
    /* clipboard: between the hands, held by the left one, facing the eyes */
    at("n_clip", 5.0); { const R = hand("R"), Lh = hand("L"), hp = headP(), h = R.p.distanceTo(hp) < Lh.p.distanceTo(hp) ? R : Lh;
      const grip = h.I.clone().add(h.Li).multiplyScalar(0.5).lerp(h.M3, 0.4), toFace = V().subVectors(hp, grip).normalize();
      const mid = V(0, grip.y, grip.z).sub(grip).setY(0).normalize();                      /* toward her centre line */
      const fw = V(0, 0, 1).applyQuaternion(model.getWorldQuaternion(new T.Quaternion())), n = V(0, 1, 0).addScaledVector(fw, -1.0).normalize();   /* tilted ~45 deg toward her eyes */
      const up = V(0, 1, 0).addScaledVector(n, -n.y).normalize(), across = V().crossVectors(up, n).normalize();
      const yv = V().crossVectors(n, across).normalize(), m = new T.Matrix4().makeBasis(across, yv, n), q = new T.Quaternion().setFromRotationMatrix(m);
      const c = grip.clone().addScaledVector(yv, 0.1).addScaledVector(mid, 0.07).addScaledVector(n, -0.006);
      attach(props.clip, h.H, c, q); }
    mx.stopAllAction(); mx.uncacheRoot(model); }
  return {model, ch, hair, props, META, look: L, kind};
}

/* ---------- back-lot NPCs (not controllable): loops of everyday actions, a chat now and then, a wave when she comes by;
   plus the stray calico cat that lives behind the store ---------- */
const npcs = [], dynCols = [];
const NPC_ACTS = {
  clerk: [{a: "n_idle", d: [5, 7]}, {feed: true}, {a: "n_drink", d: 9.5, prop: "can"}, {a: "n_idle", d: [3, 5]}, {a: "n_stretch", d: 7.2}, {a: "n_phone", d: 9.5, prop: "phone"},
          {a: "n_yawn", d: 6.3}, {a: "n_idle", d: [4, 6]}, {feed: true}, {a: "n_listen", d: 6}],
  courier: [{a: "n_clip", d: 9.5, prop: "clip"}, {walk: "courierDoor"}, {a: "n_idle", d: [2.5, 3.5]}, {walk: "courierCage"}, {a: "n_clip", d: 6, prop: "clip"}, {walk: "courierHome"},
            {a: "n_stretch", d: 7.2}, {a: "n_drink", d: 9.5, prop: "can"}, {a: "n_phone", d: 9.5, prop: "phone"}, {a: "n_idle", d: [3, 5]}]
};
const NPC_ONCE = new Set(["n_wave", "n_yawn", "n_stretch"]);
function loadNPCs(){
  if(!girl.src || !T.SkeletonUtils) return;
  const tl = new T.TextureLoader(assetLoader.manager(T,girl.assetPack));
  const ctx = {KEYU, anisotropy: Math.min(8, renderer.capabilities.getMaxAnisotropy()), hairA2C: girl.hairA2C, NOREF, HDR, texLoader: tl, outlineMask: girl.outlineMask};
  for(const kind of ["clerk", "courier"]){
    const b = buildNPC(T, girl.src, META, kind, ctx);
    const root = new T.Group(); root.scale.setScalar(CHAR.S); scene.add(root); root.add(b.model);
    for(const o of b.ch.outlines) o.layers.set(NOREF);
    for(const o of b.ch.parts) if(/FACE|EYE/.test(o.material.name)){ o.castShadow = false; o.layers.set(NOREF); }
    const by = n => b.model.getObjectByName(n);
    const mixer = new T.AnimationMixer(b.model), A = {};
    for(const c of girl.src.animations) if(/^n_/.test(c.name)){ A[c.name] = mixer.clipAction(c); if(NPC_ONCE.has(c.name)){ A[c.name].setLoop(T.LoopOnce, 1); A[c.name].clampWhenFinished = true; } }
    const home = BACK[kind + "Home"];
    const n = {kind, b, root, mixer, A, by, x: home.x, z: home.z, yaw: home.yaw, wantYaw: home.yaw, cur: null, acts: NPC_ACTS[kind], ai: kind === "clerk" ? 0 : 2, act: null, t: 0, dur: 0,
      walkTo: null, mode: "loop", greetT: -99, near: 0, leaveT: 0, blink: 2 + Math.random()*2, joy: 0, look: 0, lookAt: new T.Vector3(), talkT: 0, phase: 0,
      bones: {head: by("J_Bip_C_Head"), neck: by("J_Bip_C_Neck"), eyeL: by("J_Adj_L_FaceEye"), eyeR: by("J_Adj_R_FaceEye")}, sprT: 0, dyn: {x: home.x, z: home.z, r: 0.13}};
    n.eyeQ0 = [n.bones.eyeL.quaternion.clone(), n.bones.eyeR.quaternion.clone()];
    b.model.updateMatrixWorld(true);
    { const hq = n.bones.head.getWorldQuaternion(new T.Quaternion()); n.headFwd = v3(0, 0, 1).applyQuaternion(b.model.getWorldQuaternion(new T.Quaternion())).applyQuaternion(hq.invert()); }
    npcPlay(n, "n_idle", 0); mixer.update(0.01);
    root.position.set(n.x, groundY(n.x, n.z), n.z); root.rotation.y = n.yaw; root.updateMatrixWorld(true);
    b.ch.updateConstraints(); b.ch.resetSprings(); for(let i=0;i<30;i++) b.ch.updateSprings(1/60, root);
    dynCols.push(n.dyn); npcs.push(n);
  }
  npcs.chatT = 28 + Math.random()*10;
}
function npcPlay(n, name, fade){
  if(n.cur === name) return; const next = n.A[name]; if(!next) return;
  next.reset(); next.setEffectiveTimeScale(1); next.setEffectiveWeight(1); next.play();
  if(n.cur && n.A[n.cur]){ if(fade > 0) n.A[n.cur].crossFadeTo(next, fade, false); else n.A[n.cur].stop(); }
  n.cur = name;
}
function npcProps(n, which){ for(const k in n.b.props) n.b.props[k].visible = k === which; }

{ const bb = new T.Box3(), sz = new T.Vector3(); world.updateMatrixWorld(true);

{ world.updateMatrixWorld(true);

/* ---------- resize, quality & loop ---------- */

  document.fonts.load(`800 40px "M PLUS Rounded 1c"`, "ほしぞらマート止まれおでん肉まんスナック雨夜のコンビニ迷い猫夏祭りゴミ出しつめた〜いあったか〜いさがしています火・金rainydaysSTAFFONLY関係者以外立入禁止ごみ置き場燃える資源水朝8時までにあめつばめ便AMETSUBAMEEXPRESS")
    .then(() => texs.forEach(t => t.userData.redraw && t.userData.redraw())).catch(() => {});

  const len=streetEnd.subVectors(to,from).length();
  if(len<=skin)return true;

  if(!hintArmed && girl.ready){ hintArmed = true; setTimeout(() => hintEl.classList.add("off"), 9000);
    setTimeout(() => { if(camMode === "back" || st.z < SZ0 - 0.2) return; hintEl.textContent = "店后面有人在卸货，还有一只猫 · 点左上「后门」看看"; hintEl.classList.remove("off"); setTimeout(() => hintEl.classList.add("off"), 6500); }, 10500); }
}
